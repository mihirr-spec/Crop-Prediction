<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e7d32">
  <title>{% block title %}CropWise{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  {% if lang_font %}
  <link href="https://fonts.googleapis.com/css2?family={{ lang_font | replace(' ', '+') }}:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-body: "Inter", "{{ lang_font }}", system-ui, sans-serif;
      --font-display: "Fraunces", "{{ lang_font }}", Georgia, serif;
    }
  </style>
  {% endif %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block nav %}
  <header class="nav" id="top">
    <div class="nav-bar">
      <a class="brand" href="/">
        <svg class="brand-leaf" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M22 44c0-10 0-20-12-30 14 2 18 12 12 30z" fill="#4c8a34"/>
          <path d="M24 44C22 28 28 12 44 6c0 18-8 30-20 38z" fill="#2e7d32"/>
          <path d="M24 44c4-12 10-22 18-34" stroke="#fff" stroke-width="1.6" fill="none"/>
        </svg>
        CropWise
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-panel">
        <span class="sr-only">{{ t('nav_menu') }}</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="nav-panel" id="nav-panel">
        <nav class="nav-links">
          <a href="/">{{ t('nav_home') }}</a>
          <a href="/#crops">{{ t('nav_crops') }}</a>
        </nav>
        {% include "_lang_picker.html" %}
        <a class="nav-cta" href="/#predict">{{ t('nav_predict') }}</a>
      </div>
    </div>
  </header>
  {% endblock %}

  {% block content %}{% endblock %}

  <script>
    (function () {
      var btn = document.querySelector(".nav-toggle");
      if (!btn) return;
      var nav = btn.closest(".nav");
      btn.addEventListener("click", function () {
        var open = nav.classList.toggle("nav-open");
        btn.setAttribute("aria-expanded", open);
      });
      nav.querySelectorAll(".nav-panel a").forEach(function (a) {
        a.addEventListener("click", function () {
          nav.classList.remove("nav-open");
          btn.setAttribute("aria-expanded", "false");
        });
      });
    })();
  </script>
</body>
</html>
