<div class="rec">
  <header class="rec-head">
    <h2 class="section-title">{{ t('rec_title') }}</h2>
    <p>{{ t('rec_sub') }}</p>
  </header>

  <!-- Try sample values -->
  <div class="samples">
    <h3 class="samples-title">{{ t('try_samples') }}</h3>
    <p class="hint">{{ t('samples_hint') }}</p>
    <div class="sample-list">
      {% for s in samples %}
        <button type="button" class="sample-btn" data-reason="{{ s.reason }}" data-values='{{ s["values"] | tojson }}'>
          {{ t('sample') }} {{ loop.index }}
        </button>
      {% endfor %}
    </div>
  </div>

  <form id="rec-form" class="rec-grid" novalidate>
    <!-- Step 1: climate -->
    <section class="card">
      <h3 class="card-title"><span class="step">1</span> {{ t('step1_title') }}</h3>
      <p class="hint">{{ t('climate_hint') }}</p>

      <div class="climate-fields">
        <label>{{ t('lbl_temperature') }} <small>°C · 9–44</small>
          <input name="temperature" type="number" inputmode="decimal" step="0.1" required>
        </label>
        <label>{{ t('lbl_humidity') }} <small>% · 14–100</small>
          <input name="humidity" type="number" inputmode="decimal" step="0.1" min="0" max="100" required>
        </label>
        <label>{{ t('lbl_rainfall') }} <small>{{ t('unit_mm_month') }} · 20–300</small>
          <input name="rainfall" type="number" inputmode="decimal" step="0.1" min="0" required>
        </label>
      </div>
    </section>

    <!-- Step 2: soil -->
    <section class="card">
      <h3 class="card-title"><span class="step">2</span> {{ t('step2_title') }}</h3>
      <p class="hint">{{ t('soil_hint') }}</p>

      <div class="soil-fields">
        <label>{{ t('lbl_N') }} <small>{{ t('unit_kg_ha') }} · 0–140</small>
          <input name="N" type="number" inputmode="decimal" step="any" min="0" required>
        </label>
        <label>{{ t('lbl_P') }} <small>{{ t('unit_kg_ha') }} · 5–145</small>
          <input name="P" type="number" inputmode="decimal" step="any" min="0" required>
        </label>
        <label>{{ t('lbl_K') }} <small>{{ t('unit_kg_ha') }} · 5–205</small>
          <input name="K" type="number" inputmode="decimal" step="any" min="0" required>
        </label>
        <label>{{ t('lbl_ph') }} <small>3.5–9.9</small>
          <input name="ph" type="number" inputmode="decimal" step="0.1" min="0" max="14" required>
        </label>
      </div>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-wide" id="submit-btn">{{ t('submit') }}</button>
    </section>
  </form>

  <section id="results" class="results" hidden aria-live="polite">
    <h3 class="section-title">{{ t('results_title') }}</h3>
    <div id="result-cards" class="result-cards"></div>
    <ul id="result-warnings" class="result-warnings"></ul>
    <div id="sample-reason" class="sample-reason" hidden>
      <h4>{{ t('why_score') }}</h4>
      <p></p>
    </div>
  </section>
</div>

<script>window.I18N = {{ js_strings | tojson }};</script>
<script src="{{ url_for('static', filename='js/recommend.js') }}"></script>
